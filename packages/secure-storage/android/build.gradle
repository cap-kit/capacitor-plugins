buildscript {
    ext.kotlin_version = project.hasProperty("kotlin_version") ? project.property("kotlin_version") : '2.4.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // kotlinx.serialization COMPILER plugin. The runtime json library alone
        // is not enough: without this classpath the @Serializable models get no
        // generated serializers and every toJSObject() call fails at runtime
        // with "Serializer for class '...' is not found" (observed on device
        // in the biometrics fork: every capability getter rejected with
        // INIT_FAILED). Pinned to 2.4.21 to match the effective
        // kotlin-gradle-plugin version (duplicate classpath entries above
        // resolve to the highest, 2.4.21).
        classpath 'org.jetbrains.kotlin:kotlin-serialization:2.4.21'
    }
}

plugins {
    id "org.jlleitschuh.gradle.ktlint" version "14.2.0" apply false
}

ext {
    junitVersion = project.hasProperty('junitVersion') ? project.property('junitVersion') : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? project.property('androidxAppCompatVersion') : '1.8.0'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? project.property('androidxJunitVersion') : '1.3.0'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? project.property('androidxEspressoCoreVersion') : '3.7.0'
    androidxBiometricVersion = project.hasProperty('androidxBiometricVersion') ? project.property('androidxBiometricVersion') : '1.1.0'
}

apply plugin: 'com.android.library'
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'kotlin-android'
}
apply plugin: 'kotlin-parcelize'
// Generates the kotlinx.serialization serializers for the @Serializable result
// models. Required for toJSObject() to work at runtime; see the buildscript
// classpath note above.
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'org.jlleitschuh.gradle.ktlint'

import groovy.json.JsonSlurper

def getPluginVersion() {
    try {
        def packageJsonFile = file('../package.json')
        if (packageJsonFile.exists()) {
            def packageJson = new JsonSlurper().parseText(packageJsonFile.text)
            if (packageJson.version) {
                return packageJson.version
            }
        }
    } catch (Exception e) {
        throw new GradleException("Failed to read plugin version from package.json", e)
    }

    throw new GradleException("Plugin version not found in ../package.json")
}

def pluginVersion = getPluginVersion()

android {
    namespace = "io.capkit.securestorage"
    compileSdk = Math.max(36, project.hasProperty('compileSdkVersion') ? project.property('compileSdkVersion') as int : 36)

    // AGP 8.0+ disables BuildConfig by default for libraries.
    // We need to enable it to inject the plugin version.
    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        // Restore Credentials requires Android 9 (API 28)+. The plugin's entire
        // purpose is restore credentials, so a lower minimum is meaningless.
        minSdkVersion Math.max(24, project.hasProperty('minSdkVersion') ? project.property('minSdkVersion') as int : 24)
        targetSdkVersion Math.max(36, project.hasProperty('targetSdkVersion') ? project.property('targetSdkVersion') as int : 36)
        versionCode 1

        // Dynamic versioning (feature enabled)
        versionName = pluginVersion

        // Injects the version into the BuildConfig class ONLY if feature is enabled
        buildConfigField "String", "PLUGIN_VERSION", "\"${pluginVersion}\""

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    testOptions {
        unitTests {
            all {
                // Robolectric's FileDescriptor interceptor needs deep JVM
                // access (jdk.internal.access.SharedSecrets) at sandbox
                // boot under JDK 21+; without this open every Robolectric
                // test fails with IllegalAccessException before running.
                it.jvmArgs '--add-opens', 'java.base/jdk.internal.access=ALL-UNNAMED'
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.12.0"

    testImplementation "junit:junit:$junitVersion"
    // Robolectric enables SharedPreferences-backed tier I/O tests for
    // SecureStorageImpl on the JVM (no emulator needed). The AndroidKeyStore
    // provider is NOT emulated, so secure-tier encryption surfaces as
    // SecureStorageError.Unavailable there; the insecure tier and all
    // key-name logic run for real. Resolved and verified working with
    // AGP 9.4.1 / Kotlin 2.4.21 / JDK 21 in this suite.
    testImplementation "org.robolectric:robolectric:4.17"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
