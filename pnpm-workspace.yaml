  - '@rollup/rollup-darwin-x64@4.66.0'
  - '@rollup/rollup-freebsd-arm64@4.66.0'
  - '@rollup/rollup-freebsd-x64@4.66.0'
  - '@rollup/rollup-linux-arm-gnueabihf@4.66.0'
